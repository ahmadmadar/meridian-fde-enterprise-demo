services:
  postgres:
    image: postgres:16
    container_name: meridian-pg
    environment:
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: meridian
    ports:
      - "5432:5432"
    volumes:
      - meridian-pg-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  meridian-pg-data: